    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07111f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07111f;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer video,
      .layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #cam {
        transform-origin: 50% 45%;
      }
      /* The light at the edge of the sweep: a hot core in the logo's gold,
         a wide soft halo, leaning with the wipe's 12 degree edge. */
      #sweep {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 100%;
      }
      #sweep .beam {
        position: absolute;
        top: -20%;
        left: -90px;
        width: 180px;
        height: 140%;
        transform: rotate(12deg);
        background: linear-gradient(
          90deg,
          rgba(230, 178, 120, 0) 0%,
          rgba(230, 178, 120, 0.22) 38%,
          rgba(255, 236, 210, 0.95) 49%,
          rgba(255, 255, 255, 1) 50%,
          rgba(255, 236, 210, 0.95) 51%,
          rgba(32, 200, 241, 0.18) 64%,
          rgba(32, 200, 241, 0) 100%
        );
        mix-blend-mode: screen;
      }
      /* the shopping centre: the screens high up, its shopfronts kept out of focus */
      #mall-cam {
        transform-origin: 50% 32%;
      }
      #mall-dof {
        -webkit-mask-image: linear-gradient(to bottom, transparent 40%, #000 55%);
        mask-image: linear-gradient(to bottom, transparent 40%, #000 55%);
      }
      /* the jellyfish, close: its sign is above the frame and the wall text right of it */
      #jelly-cam {
        transform-origin: 15% 100%;
      }
    </style>
  </head>

      // 4 — through the light leak into the shopping centre's screens
      tl.fromTo("#mall-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 3.9);
      tl.fromTo("#mall-cam", { scale: 1.12, xPercent: 2 }, { scale: 1.24, xPercent: -2, duration: 1.7, ease: "sine.inOut" }, 3.9);

      tl.fromTo("#jelly-cam", { scale: 2 }, { scale: 1.62, duration: 0.6, ease: "power3.out" }, 5.6);
      tl.to("#jelly-cam", { scale: 1.72, duration: 1.4, ease: "sine.inOut" }, 6.2);
