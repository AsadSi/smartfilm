    <style>
      * {

        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07111f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07111f;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer video,
      .layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cam {
        transform-origin: 50% 50%;
      }
      /* The facade's two cameras share one origin: the closing shot hands the
         loop back to the opening at the same scale, moving at the same speed. */
      #cam-a,
      #cam-z {
        transform-origin: 50% 45%;
      }
      /* The brand's seam: a 12° gold line that leads every diagonal wipe. */
      .seam {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 100%;
      }
      .seam .beam {
        position: absolute;
        top: -20%;
        left: -90px;
        width: 180px;
        height: 140%;
        transform: rotate(12deg);
        background: linear-gradient(
          90deg,
          rgba(230, 178, 120, 0) 0%,
          rgba(230, 178, 120, 0.22) 38%,
          rgba(255, 236, 210, 0.95) 49%,
          rgba(255, 255, 255, 1) 50%,
          rgba(255, 236, 210, 0.95) 51%,
          rgba(32, 200, 241, 0.18) 64%,
          rgba(32, 200, 241, 0) 100%
        );
        mix-blend-mode: screen;
      }
    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      const W = 1920;
      const HIDDEN = "polygon(0% 0%, 0% 0%, -12% 100%, 0% 100%)";
      const SHOWN = "polygon(0% 0%, 112% 0%, 100% 100%, 0% 100%)";

      // A diagonal wipe led by the gold seam, the logo's own line.
      function wipe(wrap, seam, at, dur = 0.6) {
        tl.fromTo(wrap, { clipPath: HIDDEN }, { clipPath: SHOWN, duration: dur, ease: "power2.inOut" }, at);
        tl.fromTo(seam, { x: -0.06 * W }, { x: 1.06 * W, duration: dur, ease: "power2.inOut" }, at);
        tl.fromTo(`${seam} .beam`, { opacity: 0 }, { opacity: 1, duration: dur * 0.2, ease: "power1.out" }, at);
        tl.to(`${seam} .beam`, { opacity: 0, duration: dur * 0.25, ease: "power1.out" }, at + dur * 0.75);
      }

      // A zoom-through: the outgoing shot rushes forward and blurs, the
      // incoming one arrives oversized and settles.
      function zoomThrough(outCam, outScale, inWrap, inCam, at) {
        tl.to(outCam, { scale: outScale, filter: "blur(10px)", duration: 0.4, ease: "power2.in" }, at);
        tl.fromTo(inWrap, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, at);
        tl.fromTo(inCam, { scale: 1.3, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, at);
      }

      // A — the facade pushes in at a constant 0.03 per second (scale 1.08 at 0 s)
      tl.fromTo("#cam-a", { scale: 1.08 }, { scale: 1.146, duration: 2.2, ease: "none" }, 0);

      // A → B
      zoomThrough("#cam-a", 1.4, "#mall-wrap", "#mall-cam", 2.2);
      tl.to("#mall-cam", { scale: 1.05, duration: 3.3, ease: "sine.inOut" }, 3.0);

      // B → C
      wipe("#street-wrap", "#seam-1", 5.6);
      tl.fromTo("#street-cam", { scale: 1 }, { scale: 1.05, duration: 1.4, ease: "sine.inOut" }, 5.6);

      // C → D, then the clinic's film switches off
      zoomThrough("#street-cam", 1.3, "#clinic-wrap", "#clinic-cam", 7.05);
      tl.to("#clinic-cam", { scale: 1.04, duration: 2.45, ease: "sine.inOut" }, 7.75);
      tl.fromTo("#clinic-film", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 8.1);

      // D → E
      wipe("#glass-wrap", "#seam-2", 9.6);
      tl.fromTo("#glass-cam", { scale: 1 }, { scale: 1.05, duration: 3.6, ease: "sine.inOut" }, 9.6);

      // E → Z: the facade returns pushing in at the same 0.03 per second,
      // reaching 1.08 exactly as the video ends, where A picks it up. It starts on a
      // frame (12.625 = 303/24) and both facade clips sit half a frame into their
      // source frames, so the last frame is source frame 47 and the first is 48.
      wipe("#facade-z-wrap", "#seam-3", 12.625);
      tl.fromTo("#cam-z", { scale: 1.03875 }, { scale: 1.08, duration: 1.375, ease: "none" }, 12.625);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
