    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07111f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07111f;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer video,
      .layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #cam {
        transform-origin: 50% 45%;
      }
      /* The light at the edge of the sweep: a hot core in the logo's gold,
         a wide soft halo, leaning with the wipe's 12 degree edge. */
      #glint,
      #sweep2 {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 100%;
      }
      #sweep2 .beam {
        position: absolute;
        top: -20%;
        left: -90px;
        width: 180px;
        height: 140%;
        transform: rotate(12deg);
        background: linear-gradient(
          90deg,
          rgba(230, 178, 120, 0) 0%,
          rgba(230, 178, 120, 0.22) 38%,
          rgba(255, 236, 210, 0.95) 49%,
          rgba(255, 255, 255, 1) 50%,
          rgba(255, 236, 210, 0.95) 51%,
          rgba(32, 200, 241, 0.18) 64%,
          rgba(32, 200, 241, 0) 100%
        );
        mix-blend-mode: screen;
      }
      /* a glint: a wide soft highlight travelling the lit glass, not a reveal */
      #glint .beam {
        position: absolute;
        top: -20%;
        left: -260px;
        width: 520px;
        height: 140%;
        transform: rotate(12deg);
        background: linear-gradient(
          90deg,
          rgba(255, 248, 235, 0) 30%,
          rgba(255, 248, 235, 0.26) 50%,
          rgba(255, 248, 235, 0) 70%
        );
        mix-blend-mode: screen;
      }
      /* the closing still sits at the opening's framing, so the loop has no seam */
      #end-wrap {
        transform: scale(1.12);
        transform-origin: 50% 45%;
      }
      #mall-cam,
      #street-cam {
        transform-origin: 50% 50%;
      }
      /* the clinic: matte, then the film switches off and the room opens up */
      #clinic-cam {
        transform-origin: 50% 50%;
      }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      const W = 1920;

      // 1 — pull-back reveal on the lit facade, riding the speed ramp
      tl.fromTo("#cam", { scale: 1.12 }, { scale: 1, duration: 3.4, ease: "sine.out" }, 0);

      // 2 — a glint travels the glass while the shot is at its slowest
      tl.fromTo("#glint", { x: -0.15 * W }, { x: 1.15 * W, duration: 1.5, ease: "sine.inOut" }, 1.3);
      tl.fromTo("#glint .beam", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out" }, 1.3);
      tl.to("#glint .beam", { opacity: 0, duration: 0.4, ease: "sine.inOut" }, 2.4);

      // 3 — push through into the light leak, blurring with the speed
      tl.to("#cam", { scale: 1.16, duration: 0.9, ease: "power2.in" }, 3.5);
      tl.fromTo("#cam", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.9, ease: "power2.in" }, 3.5);

      // 4 — through the light leak into the client's mall, which dissolves
      //     into the SmartFilm building
      tl.fromTo("#mall-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 3.9);
      tl.fromTo("#mall-cam", { scale: 1 }, { scale: 1.06, duration: 4.04, ease: "sine.inOut" }, 3.9);

      // 5 — blur crossfade to the client's street: the mall drifts out of focus as it comes in
      tl.fromTo("#mall-wrap", { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.7, ease: "sine.inOut" }, 7.3);
      tl.fromTo("#street-wrap", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "sine.inOut" }, 7.3);
      tl.fromTo("#street-cam", { scale: 1.06 }, { scale: 1, duration: 1.85, ease: "sine.out" }, 7.3);

      // 6 — the opening's gold sweep returns and switches on the clinic
      tl.fromTo(
        "#clinic-wrap",
        { clipPath: "polygon(0% 0%, 0% 0%, -12% 100%, 0% 100%)" },
        { clipPath: "polygon(0% 0%, 112% 0%, 100% 100%, 0% 100%)", duration: 0.7, ease: "power2.inOut" },
        8.45,
      );
      tl.fromTo("#sweep2", { x: -0.06 * W }, { x: 1.06 * W, duration: 0.7, ease: "power2.inOut" }, 8.45);
      tl.fromTo("#sweep2 .beam", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 8.45);
      tl.to("#sweep2 .beam", { opacity: 0, duration: 0.2, ease: "power1.out" }, 8.95);
      tl.fromTo("#clinic-cam", { scale: 1.08 }, { scale: 1, duration: 3.15, ease: "sine.out" }, 8.45);

      // 7 — the film switches off: the glass clears in well under a second
      tl.fromTo("#clinic-film", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 9.55);

      // 8 — blur crossfade to the meeting-room glass, with a gentle settle of its own
      tl.fromTo("#clinic-wrap", { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.7, ease: "sine.inOut" }, 10.85);
      tl.fromTo("#glass-wrap", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "sine.inOut" }, 10.85);
      tl.fromTo("#glass-cam", { scale: 1.05 }, { scale: 1, duration: 3.2, ease: "sine.out" }, 10.85);

      // 9 — the glass softens out of focus as the first frame returns; the loop closes
      tl.fromTo("#glass-cam", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.6, ease: "sine.inOut" }, 13.4);
      tl.fromTo("#end-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, 13.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
